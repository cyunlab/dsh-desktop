      <text x="420" y="304" fill="#4d6074" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">WINDOW · NATIVE APIS</text>

      <rect x="600" y="236" width="240" height="88" rx="6" fill="#f7fbff"/>
      <rect x="600" y="236" width="240" height="88" rx="6" fill="#ffffff" stroke="#08243f" stroke-width="1"/>
      <rect x="612" y="248" width="56" height="12" rx="2" fill="transparent" stroke="rgba(8,36,63,0.40)" stroke-width="0.8"/>
      <text x="640" y="257" fill="#08243f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
      <text x="720" y="284" fill="#08243f" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">DeepSeek Harness Host</text>
      <text x="720" y="304" fill="#4d6074" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">LOCAL · VERSION MATCHED</text>

      <rect x="920" y="236" width="200" height="88" rx="6" fill="#f7fbff"/>
      <rect x="920" y="236" width="200" height="88" rx="6" fill="rgba(8,36,63,0.03)" stroke="rgba(8,36,63,0.30)" stroke-width="1"/>
      <rect x="932" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(8,36,63,0.30)" stroke-width="0.8"/>
      <text x="948" y="257" fill="#5b6f84" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
