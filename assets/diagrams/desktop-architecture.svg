<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="desktop-architecture-title desktop-architecture-desc">
      <title id="desktop-architecture-title">DeepSeek Harness Desktop 架构</title>
      <desc id="desktop-architecture-desc">用户启动跨平台桌面应用，Desktop 管理本地 DeepSeek Harness Host 并显示 Web Client，同时把原生桌面能力、运行时和界面开放给插件。</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d6074"/></marker>
        <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d6bfe"/></marker>
        <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0067d9"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f7fbff"/>

      <rect x="260" y="104" width="960" height="448" rx="8" fill="rgba(8,36,63,0.02)" stroke="rgba(8,36,63,0.12)" stroke-width="0.8"/>
      <rect x="284" y="108" width="124" height="16" rx="2" fill="#f7fbff"/>
      <text x="346" y="120" fill="#5b6f84" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DESKTOP APP</text>

      <line x1="200" y1="280" x2="320" y2="280" stroke="#0067d9" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
      <line x1="520" y1="280" x2="600" y2="280" stroke="#4d6bfe" stroke-width="1.2" marker-end="url(#arch-arrow-accent)"/>
      <line x1="840" y1="280" x2="920" y2="280" stroke="#4d6074" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

      <line x1="480" y1="416" x2="480" y2="324" stroke="#0067d9" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow-link)"/>
      <line x1="720" y1="416" x2="720" y2="324" stroke="#0067d9" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow-link)"/>
      <line x1="960" y1="416" x2="960" y2="324" stroke="#0067d9" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow-link)"/>

      <rect x="220" y="252" width="72" height="16" rx="2" fill="#f7fbff"/>
      <text x="256" y="264" fill="#0067d9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAUNCH</text>
