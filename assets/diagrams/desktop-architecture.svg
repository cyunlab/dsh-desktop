      <text x="1020" y="304" fill="#4d6074" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">SESSIONS · WORKSPACES</text>

      <rect x="400" y="416" width="640" height="80" rx="6" fill="#f7fbff"/>
      <rect x="400" y="416" width="640" height="80" rx="6" fill="rgba(0,103,217,0.05)" stroke="#0067d9" stroke-width="1"/>
      <rect x="412" y="428" width="56" height="12" rx="2" fill="transparent" stroke="rgba(0,103,217,0.45)" stroke-width="0.8"/>
      <text x="440" y="437" fill="#0067d9" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLUGINS</text>
      <text x="720" y="460" fill="#08243f" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">把原生桌面能力、运行时与界面开放给插件</text>
      <text x="720" y="480" fill="#4d6074" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">CLIENT APIS · WORKFLOWS · UI BLOCKS</text>

      <line x1="40" y1="624" x2="1240" y2="624" stroke="rgba(8,36,63,0.12)" stroke-width="0.8"/>
      <text x="40" y="648" fill="#5b6f84" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="148" y1="664" x2="184" y2="664" stroke="#0067d9" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
      <text x="196" y="668" fill="#4d6074" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">启动</text>
      <line x1="296" y1="664" x2="332" y2="664" stroke="#4d6bfe" stroke-width="1.2" marker-end="url(#arch-arrow-accent)"/>
      <text x="344" y="668" fill="#4d6074" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">主要运行路径</text>
      <line x1="520" y1="664" x2="556" y2="664" stroke="#0067d9" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow-link)"/>
      <text x="568" y="668" fill="#4d6074" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">插件扩展</text>
    </svg>
