      <text x="560" y="264" fill="#4d6bfe" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
      <rect x="852" y="252" width="56" height="16" rx="2" fill="#f7fbff"/>
      <text x="880" y="264" fill="#4d6074" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVE</text>

