<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>DeepSeek Harness 一切皆插件</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f7fbff;
      --ink: #08243f;
      --muted: #4d6074;
      --accent: #4d6bfe;
      --sans: 'Geist', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Songti SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 12px/1 var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font: 400 32px/1.15 var(--serif);
    }
    svg { display: block; width: 100%; min-width: 960px; }
  </style>
</head>
