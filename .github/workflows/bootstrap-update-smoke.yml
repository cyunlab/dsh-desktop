name: First-updater bootstrap fresh-install evidence

on:
  workflow_call:
    inputs:
      candidate_tag:
        description: Approved first-updater candidate tag
        required: true
        type: string
      candidate_commit:
        description: Approved exact 40-character candidate commit
        required: true
        type: string
      manifest_url:
        description: Immutable candidate manifest HTTPS URL
        required: true
        type: string
      manifest_sha256:
        description: Expected immutable candidate manifest SHA-256
        required: true
        type: string
      artifact_name_prefix:
        description: Release artifact name prefix
        required: false
        default: dsh-desktop
        type: string
    secrets:
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
    outputs:
      evidence_artifact_name:
        description: Verified four-target bootstrap evidence artifact
        value: ${{ jobs.aggregate.outputs.evidence_artifact_name }}

permissions:
  contents: read

jobs:
  bootstrap-smoke:
    name: Bootstrap fresh install ${{ matrix.target }}
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x86_64
            expected_os: win32
            expected_arch: x64
          - runner: ubuntu-22.04
            target: linux-x86_64
            expected_os: linux
            expected_arch: x64
          - runner: macos-15
            target: darwin-aarch64
            expected_os: darwin
            expected_arch: arm64
          - runner: macos-15-intel
            target: darwin-x86_64
            expected_os: darwin
            expected_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Require the one-time candidate identity approved by production
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          APPROVED_TAG: ${{ vars.UPDATER_BOOTSTRAP_TAG }}
          APPROVED_VERSION: ${{ vars.UPDATER_BOOTSTRAP_VERSION }}
          APPROVED_COMMIT: ${{ vars.UPDATER_BOOTSTRAP_COMMIT }}
        run: |
          set -euo pipefail
          test -n "$APPROVED_TAG"
          test -n "$APPROVED_VERSION"
          test -n "$APPROVED_COMMIT"
          test "$CANDIDATE_TAG" = "$APPROVED_TAG"
          test "${CANDIDATE_TAG#v}" = "$APPROVED_VERSION"
          test "$CANDIDATE_COMMIT" = "$APPROVED_COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the Linux virtual display required by the real AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
      - name: Bind the approved tag to trusted default-branch history and a published Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${CANDIDATE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(git rev-parse "refs/tags/${CANDIDATE_TAG}^{}")" = "$CANDIDATE_COMMIT"
          test "$(gh release view "$CANDIDATE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$CANDIDATE_TAG" --json isPrerelease --jq .isPrerelease)" = false
      - name: Assert the hosted runner matches the evidence target
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          node -e "if (process.platform !== process.env.EXPECTED_OS || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test "${PROCESSOR_ARCHITECTURE:-}" = AMD64
          else
            machine="$(uname -m)"
            [[ "$EXPECTED_ARCH:$machine" == "x64:x86_64" || "$EXPECTED_ARCH:$machine" == "arm64:arm64" ]]
          fi
      - name: Download the exact immutable candidate package and signature
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          ISOLATED_MANIFEST_URL: ${{ inputs.manifest_url }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node scripts/prepare-update-smoke-assets.mjs \
            --manifest-url "$ISOLATED_MANIFEST_URL" \
            --target "$TARGET" \
            --expected-version "${CANDIDATE_TAG#v}" \
            --output-directory bootstrap-assets \
            --label candidate
          test "$(node -p "require('./bootstrap-assets/candidate/asset.json').manifestSha256")" = "$EXPECTED_MANIFEST_SHA256"
      - name: Apply the fail-closed repository-owned fresh-install producer
        shell: bash
        env:
          DSH_BOOTSTRAP_UPDATE_SMOKE_DRIVER: scripts/bootstrap-update-smoke-driver.mjs
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SIGNING_CONFIGURED: ${{ vars.UPDATER_BOOTSTRAP_MACOS_SIGNING_CONFIGURED }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_BASE_URL"
          test -n "$TAURI_SIGNING_PUBLIC_KEY"
          test "$SIGNING_CONFIGURED" = true || test "$SIGNING_CONFIGURED" = false
          expected_updater_endpoint="${UPDATE_BASE_URL%/}/dsh-desktop/channels/stable/latest.json"
          candidate_artifact="$(node -p "require('./bootstrap-assets/candidate/asset.json').artifactPath")"
          candidate_signature="$(node -p "require('./bootstrap-assets/candidate/asset.json').signaturePath")"
          candidate_url="$(node -p "require('./bootstrap-assets/candidate/asset.json').artifactUrl")"
          node scripts/run-bootstrap-update-smoke.mjs \
            --target "$TARGET" \
            --candidate-tag "$CANDIDATE_TAG" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-manifest bootstrap-assets/candidate/manifest.json \
            --candidate-manifest-url "${{ inputs.manifest_url }}" \
            --candidate-package "$candidate_artifact" \
            --candidate-signature "$candidate_signature" \
            --candidate-package-url "$candidate_url" \
            --candidate-release-url "https://github.com/cyunlab/dsh-desktop/releases/tag/$CANDIDATE_TAG" \
            --expected-updater-endpoint "$expected_updater_endpoint" \
            --expected-updater-public-key "$TAURI_SIGNING_PUBLIC_KEY" \
            --signing-configured "$SIGNING_CONFIGURED" \
            --output-directory bootstrap-evidence
      - name: Require checksummed target evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "bootstrap-evidence/${{ matrix.target }}.json"
          test -s "bootstrap-evidence/${{ matrix.target }}.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-update-evidence-${{ inputs.candidate_tag }}-${{ inputs.candidate_commit }}-${{ matrix.target }}
          path: bootstrap-evidence/*
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Verify four-target bootstrap evidence
    needs: bootstrap-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      evidence_artifact_name: bootstrap-update-evidence-${{ inputs.candidate_tag }}-${{ inputs.candidate_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bootstrap-update-evidence-${{ inputs.candidate_tag }}-${{ inputs.candidate_commit }}-*
          path: bootstrap-evidence
          merge-multiple: true
      - name: Verify complete real bootstrap evidence
        run: >-
          node scripts/verify-bootstrap-update-evidence.mjs
          --evidence bootstrap-evidence
          --candidate-tag "${{ inputs.candidate_tag }}"
          --candidate-commit "${{ inputs.candidate_commit }}"
          --manifest-sha256 "${{ inputs.manifest_sha256 }}"
          --max-age-hours 24
          --require-real-bootstrap
      - name: Attest aggregate evidence to this workflow identity
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: bootstrap-evidence/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-update-evidence-${{ inputs.candidate_tag }}-${{ inputs.candidate_commit }}
          path: bootstrap-evidence/*
          if-no-files-found: error
          retention-days: 30
