name: Promote Stable release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: stable-promotion
  cancel-in-progress: false

jobs:
  prepare-candidate:
    name: Prepare immutable OSS candidate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      candidate_commit: ${{ steps.candidate.outputs.candidate_commit }}
      manifest_url: ${{ steps.candidate.outputs.manifest_url }}
      manifest_sha256: ${{ steps.candidate.outputs.manifest_sha256 }}
      previous_stable_tag: ${{ steps.candidate.outputs.previous_stable_tag }}
      previous_stable_url: ${{ steps.candidate.outputs.previous_stable_url }}
      previous_stable_manifest_sha256: ${{ steps.candidate.outputs.previous_stable_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate the release tag without executing its code
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{}" refs/remotes/origin/main
          MANIFEST_ROOT="$RUNNER_TEMP/release-manifests"
          mkdir -p "$MANIFEST_ROOT/src-tauri"
          for manifest in package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock; do
            git show "refs/tags/${RELEASE_TAG}^{}:${manifest}" > "$MANIFEST_ROOT/${manifest}"
          done
          node scripts/verify-release-version.mjs "$RELEASE_TAG" "$MANIFEST_ROOT"
      - name: Install pinned minisign verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign=0.11-1
          minisign -v
      - name: Install checksum-verified ossutil
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_ARCHIVE="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64.zip"
          OSSUTIL_EXTRACT_DIR="$RUNNER_TEMP/ossutil-v1.7.19"
          OSSUTIL_BIN_DIR="$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error \
            --output "$OSSUTIL_ARCHIVE" \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          printf '%s  %s\n' \
            dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343 \
            "$OSSUTIL_ARCHIVE" | sha256sum --check
          mkdir -p "$OSSUTIL_EXTRACT_DIR" "$OSSUTIL_BIN_DIR"
          unzip -q "$OSSUTIL_ARCHIVE" -d "$OSSUTIL_EXTRACT_DIR"
          install -m 0755 \
            "$OSSUTIL_EXTRACT_DIR/ossutil-v1.7.19-linux-amd64/ossutil" \
            "$OSSUTIL_BIN_DIR/ossutil"
          echo "$OSSUTIL_BIN_DIR" >> "$GITHUB_PATH"
      - name: Download the four signed updater packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          for target in windows-x86_64 linux-x86_64 darwin-aarch64 darwin-x86_64; do
            mkdir -p "artifacts/${target}"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "artifacts/${target}" \
              --pattern "dsh-desktop-${target}-updater.*"
          done
      - name: Exchange candidate preparation OIDC identity
        id: candidate-credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: dsh-candidate-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Upload and verify immutable candidate objects
        id: candidate
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.candidate-credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.candidate-credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.candidate-credentials.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          candidate_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
          node scripts/promote-stable-release.mjs --prepare-candidate \
            --tag "$RELEASE_TAG" --notes "$RELEASE_NOTES" --published-at "$PUBLISHED_AT" \
            --candidate-commit "$candidate_commit" --assets artifacts \
            --prefix dsh-desktop --output candidate.json
          node -e '
            const candidate = require("./candidate.json");
            for (const key of ["candidate_tag", "candidate_commit", "manifest_url", "manifest_sha256", "previous_stable_tag", "previous_stable_url", "previous_stable_manifest_sha256"])
              process.stdout.write(`${key}=${candidate[key]}\n`)
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-promotion-candidate-${{ github.run_id }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 30

  native-update-smoke:
    name: Validate candidate through four native update paths
    needs: prepare-candidate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/update-smoke.yml
    with:
      candidate_tag: ${{ needs.prepare-candidate.outputs.candidate_tag }}
      candidate_commit: ${{ needs.prepare-candidate.outputs.candidate_commit }}
      manifest_url: ${{ needs.prepare-candidate.outputs.manifest_url }}
      manifest_sha256: ${{ needs.prepare-candidate.outputs.manifest_sha256 }}
      previous_stable_tag: ${{ needs.prepare-candidate.outputs.previous_stable_tag }}
      stable_manifest_url: ${{ needs.prepare-candidate.outputs.previous_stable_url }}
      previous_stable_manifest_sha256: ${{ needs.prepare-candidate.outputs.previous_stable_manifest_sha256 }}
      artifact_name_prefix: dsh-desktop
      signing_configured: true

  aggregate-evidence:
    name: Admit complete real native evidence
    needs: [prepare-candidate, native-update-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-smoke-evidence-${{ needs.prepare-candidate.outputs.candidate_tag }}-${{ needs.prepare-candidate.outputs.candidate_commit }}
          path: evidence
      - name: Verify aggregate evidence attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(evidence/*)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -f "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
      - name: Verify exact, fresh, real four-target evidence
        run: >-
          node scripts/verify-update-smoke-evidence.mjs --evidence evidence
          --candidate-tag "${{ needs.prepare-candidate.outputs.candidate_tag }}"
          --candidate-commit "${{ needs.prepare-candidate.outputs.candidate_commit }}"
          --manifest-sha256 "${{ needs.prepare-candidate.outputs.manifest_sha256 }}"
          --baseline-tag "${{ needs.prepare-candidate.outputs.previous_stable_tag }}"
          --baseline-manifest-sha256 "${{ needs.prepare-candidate.outputs.previous_stable_manifest_sha256 }}"
          --max-age-hours 24 --require-real-native

  promote-stable:
    name: Promote verified candidate to OSS Stable
    needs: [prepare-candidate, aggregate-evidence]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-promotion-candidate-${{ github.run_id }}
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-smoke-evidence-${{ needs.prepare-candidate.outputs.candidate_tag }}-${{ needs.prepare-candidate.outputs.candidate_commit }}
          path: evidence
      - name: Verify aggregate evidence attestations again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(evidence/*)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -f "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
      - name: Reverify promotion admission before OIDC exchange
        shell: bash
        env:
          CANDIDATE_TAG: ${{ needs.prepare-candidate.outputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ needs.prepare-candidate.outputs.candidate_commit }}
          MANIFEST_SHA256: ${{ needs.prepare-candidate.outputs.manifest_sha256 }}
          PREVIOUS_STABLE_TAG: ${{ needs.prepare-candidate.outputs.previous_stable_tag }}
          PREVIOUS_STABLE_MANIFEST_SHA256: ${{ needs.prepare-candidate.outputs.previous_stable_manifest_sha256 }}
        run: |
          set -euo pipefail
          node -e '
            const candidate = require("./candidate/candidate.json");
            const expected = {
              candidate_tag: process.env.CANDIDATE_TAG,
              candidate_commit: process.env.CANDIDATE_COMMIT,
              manifest_sha256: process.env.MANIFEST_SHA256
            };
            for (const [key, value] of Object.entries(expected)) {
              if (candidate[key] !== value) throw new Error(`candidate artifact ${key} mismatch`);
            }
          '
          node scripts/verify-update-smoke-evidence.mjs --evidence evidence \
            --candidate-tag "$CANDIDATE_TAG" --candidate-commit "$CANDIDATE_COMMIT" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --baseline-tag "$PREVIOUS_STABLE_TAG" \
            --baseline-manifest-sha256 "$PREVIOUS_STABLE_MANIFEST_SHA256" \
            --max-age-hours 24 --require-real-native
      - name: Install checksum-verified ossutil
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_ARCHIVE="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64.zip"
          OSSUTIL_EXTRACT_DIR="$RUNNER_TEMP/ossutil-v1.7.19"
          OSSUTIL_BIN_DIR="$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error --output "$OSSUTIL_ARCHIVE" \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          printf '%s  %s\n' dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343 \
            "$OSSUTIL_ARCHIVE" | sha256sum --check
          mkdir -p "$OSSUTIL_EXTRACT_DIR" "$OSSUTIL_BIN_DIR"
          unzip -q "$OSSUTIL_ARCHIVE" -d "$OSSUTIL_EXTRACT_DIR"
          install -m 0755 "$OSSUTIL_EXTRACT_DIR/ossutil-v1.7.19-linux-amd64/ossutil" "$OSSUTIL_BIN_DIR/ossutil"
          echo "$OSSUTIL_BIN_DIR" >> "$GITHUB_PATH"
      - name: Exchange final promotion OIDC identity
        id: promotion-credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: dsh-promote-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Write Stable pointer last
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.promotion-credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.promotion-credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.promotion-credentials.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: >-
          node scripts/promote-stable-release.mjs --finalize-candidate
          --candidate candidate/candidate.json --prefix dsh-desktop
