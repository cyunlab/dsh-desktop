name: Diagnose Linux AppImage bundling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-linux-appimage:
    name: Diagnose Linux AppImage bundling
    runs-on: ubuntu-24.04
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
      RUST_LOG: tauri_bundler=debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build AppImage with verbose linuxdeploy output
        run: |
          pnpm ensure:node-sidecar
          pnpm exec tauri build --verbose --config src-tauri/tauri.linux.conf.json
