name: Bootstrap first updater Stable

on:
  workflow_dispatch:
    inputs:
      approved_tag:
        description: Exact published first-updater release tag
        required: true
        type: string
      approved_version:
        description: Exact first-updater semantic version
        required: true
        type: string
      approved_commit:
        description: Exact 40-character release commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: first-updater-stable-bootstrap
  cancel-in-progress: false

jobs:
  prepare-bootstrap:
    name: Prepare approved one-time bootstrap candidate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      candidate_commit: ${{ steps.candidate.outputs.candidate_commit }}
      manifest_url: ${{ steps.candidate.outputs.manifest_url }}
      manifest_sha256: ${{ steps.candidate.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate exact approved published release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ github.event.inputs.approved_tag }}
          APPROVED_VERSION: ${{ github.event.inputs.approved_version }}
          APPROVED_COMMIT: ${{ github.event.inputs.approved_commit }}
          CONFIGURED_TAG: ${{ vars.UPDATER_BOOTSTRAP_TAG }}
          CONFIGURED_VERSION: ${{ vars.UPDATER_BOOTSTRAP_VERSION }}
          CONFIGURED_COMMIT: ${{ vars.UPDATER_BOOTSTRAP_COMMIT }}
          CONFIGURED_LEGACY_VERSION: ${{ vars.UPDATER_BOOTSTRAP_LEGACY_VERSION }}
          CONFIGURED_LEGACY_MANIFEST_SHA256: ${{ vars.UPDATER_BOOTSTRAP_LEGACY_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIGURED_LEGACY_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIGURED_LEGACY_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$APPROVED_TAG" == "v$APPROVED_VERSION" ]]
          test "$APPROVED_TAG" = "$CONFIGURED_TAG"
          test "$APPROVED_VERSION" = "$CONFIGURED_VERSION"
          test "$APPROVED_COMMIT" = "$CONFIGURED_COMMIT"
          actual_commit="$(git rev-parse "refs/tags/${APPROVED_TAG}^{}")"
          test "$actual_commit" = "$APPROVED_COMMIT"
          git merge-base --is-ancestor "$APPROVED_COMMIT" refs/remotes/origin/main
          release_json="$(gh release view "$APPROVED_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,publishedAt,body)"
          RELEASE_JSON="$release_json" node -e '
            const release = JSON.parse(process.env.RELEASE_JSON);
            if (release.tagName !== process.env.APPROVED_TAG || release.isDraft || !release.publishedAt || !release.body?.trim())
              throw new Error("approved release must exist, be published, and have notes");
          '
      - name: Install pinned publication verifiers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign=0.11-1
          minisign -v
          archive="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          printf '%s  %s\n' dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343 "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/ossutil"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/ossutil/ossutil-v1.7.19-linux-amd64/ossutil" "$RUNNER_TEMP/bin/ossutil"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download exact four-target published updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ github.event.inputs.approved_tag }}
        run: |
          set -euo pipefail
          for target in windows-x86_64 linux-x86_64 darwin-aarch64 darwin-x86_64; do
            mkdir -p "artifacts/${target}"
            gh release download "$APPROVED_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir "artifacts/${target}" --pattern "dsh-desktop-${target}-updater.*"
          done
      - name: Exchange bootstrap preparation OIDC identity
        id: credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: dsh-bootstrap-prepare-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Prepare and bind immutable bootstrap candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.credentials.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          APPROVED_TAG: ${{ github.event.inputs.approved_tag }}
          APPROVED_VERSION: ${{ github.event.inputs.approved_version }}
          APPROVED_COMMIT: ${{ github.event.inputs.approved_commit }}
          APPROVED_LEGACY_VERSION: ${{ vars.UPDATER_BOOTSTRAP_LEGACY_VERSION }}
          APPROVED_LEGACY_MANIFEST_SHA256: ${{ vars.UPDATER_BOOTSTRAP_LEGACY_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$APPROVED_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt,body)"
          notes="$(RELEASE_JSON="$release_json" node -p 'JSON.parse(process.env.RELEASE_JSON).body')"
          published_at="$(RELEASE_JSON="$release_json" node -p 'JSON.parse(process.env.RELEASE_JSON).publishedAt')"
          node scripts/promote-stable-release.mjs --prepare-bootstrap \
            --approved-tag "$APPROVED_TAG" --approved-version "$APPROVED_VERSION" \
            --approved-commit "$APPROVED_COMMIT" \
            --approved-legacy-version "$APPROVED_LEGACY_VERSION" \
            --approved-legacy-manifest-sha256 "$APPROVED_LEGACY_MANIFEST_SHA256" \
            --notes "$notes" --published-at "$published_at" \
            --assets artifacts --prefix dsh-desktop --output candidate.json
          node -e '
            const candidate = require("./candidate.json");
            for (const key of ["candidate_tag", "candidate_commit", "manifest_url", "manifest_sha256"])
              process.stdout.write(`${key}=${candidate[key]}\n`);
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-stable-candidate-${{ github.run_id }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 90

  bootstrap-native-smoke:
    name: Collect four-target bootstrap fresh-install evidence
    needs: prepare-bootstrap
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-update-smoke.yml
    with:
      candidate_tag: ${{ needs.prepare-bootstrap.outputs.candidate_tag }}
      candidate_commit: ${{ needs.prepare-bootstrap.outputs.candidate_commit }}
      manifest_url: ${{ needs.prepare-bootstrap.outputs.manifest_url }}
      manifest_sha256: ${{ needs.prepare-bootstrap.outputs.manifest_sha256 }}
      artifact_name_prefix: dsh-desktop

  admit-bootstrap-evidence:
    name: Admit exact bootstrap evidence
    needs: [prepare-bootstrap, bootstrap-native-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap-native-smoke.outputs.evidence_artifact_name }}
          path: evidence
      - name: Verify evidence artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify evidence/* --repo "$GITHUB_REPOSITORY"
      - name: Verify exact real bootstrap evidence
        run: >-
          node scripts/verify-bootstrap-update-evidence.mjs --evidence evidence
          --candidate-tag "${{ github.event.inputs.approved_tag }}"
          --candidate-commit "${{ github.event.inputs.approved_commit }}"
          --manifest-sha256 "${{ needs.prepare-bootstrap.outputs.manifest_sha256 }}"
          --max-age-hours 24 --require-real-bootstrap

  finalize-bootstrap:
    name: Record bootstrap receipt and write Stable last
    needs: [prepare-bootstrap, bootstrap-native-smoke, admit-bootstrap-evidence]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bootstrap-stable-candidate-${{ github.run_id }}
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap-native-smoke.outputs.evidence_artifact_name }}
          path: evidence
      - name: Reverify evidence artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify evidence/* --repo "$GITHUB_REPOSITORY"
      - name: Reverify exact bootstrap evidence before credentials
        run: >-
          node scripts/verify-bootstrap-update-evidence.mjs --evidence evidence
          --candidate-tag "${{ github.event.inputs.approved_tag }}"
          --candidate-commit "${{ github.event.inputs.approved_commit }}"
          --manifest-sha256 "${{ needs.prepare-bootstrap.outputs.manifest_sha256 }}"
          --max-age-hours 24 --require-real-bootstrap
      - name: Rebind candidate artifact to the approved identity
        env:
          APPROVED_TAG: ${{ github.event.inputs.approved_tag }}
          APPROVED_VERSION: ${{ github.event.inputs.approved_version }}
          APPROVED_COMMIT: ${{ github.event.inputs.approved_commit }}
          MANIFEST_SHA256: ${{ needs.prepare-bootstrap.outputs.manifest_sha256 }}
        run: |
          node -e '
            const candidate = require("./candidate/candidate.json");
            const expected = {
              candidate_tag: process.env.APPROVED_TAG,
              candidate_version: process.env.APPROVED_VERSION,
              candidate_commit: process.env.APPROVED_COMMIT,
              manifest_sha256: process.env.MANIFEST_SHA256
            };
            for (const [key, value] of Object.entries(expected))
              if (candidate[key] !== value) throw new Error(`bootstrap candidate ${key} mismatch`);
          '
      - name: Install checksum-verified ossutil
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          printf '%s  %s\n' dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343 "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/ossutil"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/ossutil/ossutil-v1.7.19-linux-amd64/ossutil" "$RUNNER_TEMP/bin/ossutil"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Exchange final bootstrap OIDC identity
        id: credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: dsh-bootstrap-finalize-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Write immutable receipt, verify it, then write Stable last
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.credentials.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          APPROVED_TAG: ${{ vars.UPDATER_BOOTSTRAP_TAG }}
          APPROVED_VERSION: ${{ vars.UPDATER_BOOTSTRAP_VERSION }}
          APPROVED_COMMIT: ${{ vars.UPDATER_BOOTSTRAP_COMMIT }}
          APPROVED_LEGACY_VERSION: ${{ vars.UPDATER_BOOTSTRAP_LEGACY_VERSION }}
          APPROVED_LEGACY_MANIFEST_SHA256: ${{ vars.UPDATER_BOOTSTRAP_LEGACY_MANIFEST_SHA256 }}
        run: >-
          node scripts/promote-stable-release.mjs --finalize-bootstrap
          --candidate candidate/candidate.json --evidence evidence
          --max-age-hours 24 --prefix dsh-desktop
          --approved-tag "$APPROVED_TAG" --approved-version "$APPROVED_VERSION"
          --approved-commit "$APPROVED_COMMIT"
          --approved-legacy-version "$APPROVED_LEGACY_VERSION"
          --approved-legacy-manifest-sha256 "$APPROVED_LEGACY_MANIFEST_SHA256"
