name: Desktop behavior tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }} behavior tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022

    steps:
      - name: Check out the pinned Harness source reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux Tauri and WebView test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install stable Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Create diagnostics directory
        shell: bash
        run: mkdir -p artifacts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: set -o pipefail; pnpm typecheck 2>&1 | tee artifacts/typecheck.log

      - name: Run unit tests
        id: unit
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: set -o pipefail; pnpm test 2>&1 | tee artifacts/unit.log

      - name: Run real-Host integration tests
        id: integration
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: set -o pipefail; pnpm test:integration 2>&1 | tee artifacts/integration.log

      - name: Download the fixed official Node sidecar and build the runtime
        id: runtime_build
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: set -o pipefail; { pnpm ensure:node-sidecar && pnpm build; } 2>&1 | tee artifacts/runtime-build.log

      - name: Run real official Node + Harness smoke test
        id: smoke
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: set -o pipefail; pnpm smoke:node-sidecar 2>&1 | tee artifacts/smoke.log

      - name: Install tauri-driver for supported WebDriver platforms
        if: runner.os != 'macOS' && hashFiles('tests/e2e/**') != ''
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: cargo install tauri-driver --locked 2>&1 | tee artifacts/tauri-driver.log

      - name: Run Tauri WebDriver E2E when a checked-in suite exists
        id: e2e
        if: hashFiles('tests/e2e/**') != ''
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: set -o pipefail; pnpm test:e2e 2>&1 | tee artifacts/e2e.log

      - name: Keep the official Node smoke gate when no E2E suite is present
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'No checked-in Tauri E2E suite is present yet; the official Node + Harness smoke test remains the runtime gate. When tests/e2e is added, macOS uses the embedded Tauri WebDriver provider.'

      - name: Verify the Harness submodule stayed unchanged
        id: harness_guard
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          test -z "$(git -C deepseek-harness status --porcelain)"
          git diff --exit-code --submodule=short -- deepseek-harness

      - name: Sanitize bounded textual diagnostics
        id: sanitize
        if: always()
        continue-on-error: true
        shell: bash
        run: node scripts/sanitize-ci-artifacts.mjs

      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behavior-test-diagnostics-${{ runner.os }}-${{ runner.arch }}
          path: sanitized-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if any behavior check failed
        if: always()
        shell: bash
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          RUNTIME_BUILD_OUTCOME: ${{ steps.runtime_build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          HARNESS_GUARD_OUTCOME: ${{ steps.harness_guard.outcome }}
          SANITIZE_OUTCOME: ${{ steps.sanitize.outcome }}
        run: |
          outcomes="$TYPECHECK_OUTCOME $UNIT_OUTCOME $INTEGRATION_OUTCOME $RUNTIME_BUILD_OUTCOME $SMOKE_OUTCOME $E2E_OUTCOME $HARNESS_GUARD_OUTCOME $SANITIZE_OUTCOME"
          case " $outcomes " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
