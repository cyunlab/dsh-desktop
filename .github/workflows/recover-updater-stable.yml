name: Recover broken updater Stable

on:
  workflow_dispatch:
    inputs:
      approved_tag:
        description: Exact published recovery release tag
        required: true
        type: string
      approved_version:
        description: Exact recovery semantic version
        required: true
        type: string
      approved_commit:
        description: Exact 40-character recovery commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-promotion
  cancel-in-progress: false

jobs:
  prepare-recovery:
    name: Prepare approved one-time recovery candidate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      candidate_commit: ${{ steps.candidate.outputs.candidate_commit }}
      manifest_url: ${{ steps.candidate.outputs.manifest_url }}
      manifest_sha256: ${{ steps.candidate.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate exact protected recovery identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ github.event.inputs.approved_tag }}
          APPROVED_VERSION: ${{ github.event.inputs.approved_version }}
          APPROVED_COMMIT: ${{ github.event.inputs.approved_commit }}
          CONFIGURED_TAG: ${{ vars.UPDATER_RECOVERY_TAG }}
          CONFIGURED_VERSION: ${{ vars.UPDATER_RECOVERY_VERSION }}
          CONFIGURED_COMMIT: ${{ vars.UPDATER_RECOVERY_COMMIT }}
          CANDIDATE_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_MANIFEST_SHA256 }}
          MACOS_SIGNING_CONFIGURED: ${{ vars.UPDATER_RECOVERY_MACOS_SIGNING_CONFIGURED }}
          BROKEN_VERSION: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_VERSION }}
          BROKEN_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_MANIFEST_SHA256 }}
          PRIOR_RECEIPT_KEY: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_KEY }}
          PRIOR_RECEIPT_SHA256: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_SHA256 }}
          FAILED_PROMOTION_RUN_ID: ${{ vars.UPDATER_RECOVERY_FAILED_PROMOTION_RUN_ID }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BROKEN_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRIOR_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_PROMOTION_RUN_ID" =~ ^[0-9]+$ ]]
          test "$MACOS_SIGNING_CONFIGURED" = true
          test "$APPROVED_TAG" = "v$APPROVED_VERSION"
          test "$APPROVED_TAG" = "$CONFIGURED_TAG"
          test "$APPROVED_VERSION" = "$CONFIGURED_VERSION"
          test "$APPROVED_COMMIT" = "$CONFIGURED_COMMIT"
          test "$BROKEN_VERSION" != "$APPROVED_VERSION"
          test "$(git rev-parse "refs/tags/${APPROVED_TAG}^{}")" = "$APPROVED_COMMIT"
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          release_json="$(gh release view "$APPROVED_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,publishedAt,body)"
          RELEASE_JSON="$release_json" node -e '
            const release = JSON.parse(process.env.RELEASE_JSON)
            if (release.tagName !== process.env.APPROVED_TAG || release.isDraft || release.isPrerelease || !release.publishedAt || !release.body?.trim())
              throw new Error("approved recovery Release is not a complete published Stable candidate")
          '
      - name: Install pinned publication verifiers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign=0.11-1
          archive="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          printf '%s  %s\n' dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343 "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/ossutil"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/ossutil/ossutil-v1.7.19-linux-amd64/ossutil" "$RUNNER_TEMP/bin/ossutil"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download exact four-target published updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ github.event.inputs.approved_tag }}
        run: |
          set -euo pipefail
          for target in windows-x86_64 linux-x86_64 darwin-aarch64 darwin-x86_64; do
            mkdir -p "artifacts/${target}"
            gh release download "$APPROVED_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir "artifacts/${target}" --pattern "dsh-desktop-${target}-updater.*"
          done
      - name: Exchange recovery preparation OIDC identity
        id: credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: dsh-recovery-prepare-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Prepare and bind immutable recovery candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.credentials.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          APPROVED_TAG: ${{ github.event.inputs.approved_tag }}
          APPROVED_VERSION: ${{ github.event.inputs.approved_version }}
          APPROVED_COMMIT: ${{ github.event.inputs.approved_commit }}
          CANDIDATE_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_MANIFEST_SHA256 }}
          BROKEN_VERSION: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_VERSION }}
          BROKEN_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_MANIFEST_SHA256 }}
          PRIOR_RECEIPT_KEY: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_KEY }}
          PRIOR_RECEIPT_SHA256: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_SHA256 }}
          FAILED_PROMOTION_RUN_ID: ${{ vars.UPDATER_RECOVERY_FAILED_PROMOTION_RUN_ID }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$APPROVED_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt,body)"
          notes="$(RELEASE_JSON="$release_json" node -p 'JSON.parse(process.env.RELEASE_JSON).body')"
          published_at="$(RELEASE_JSON="$release_json" node -p 'JSON.parse(process.env.RELEASE_JSON).publishedAt')"
          node scripts/promote-stable-release.mjs --prepare-updater-recovery \
            --approved-tag "$APPROVED_TAG" --approved-version "$APPROVED_VERSION" \
            --approved-commit "$APPROVED_COMMIT" \
            --approved-candidate-manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --approved-broken-stable-version "$BROKEN_VERSION" \
            --approved-broken-stable-manifest-sha256 "$BROKEN_MANIFEST_SHA256" \
            --approved-prior-receipt-key "$PRIOR_RECEIPT_KEY" \
            --approved-prior-receipt-sha256 "$PRIOR_RECEIPT_SHA256" \
            --approved-failed-promotion-run-id "$FAILED_PROMOTION_RUN_ID" \
            --notes "$notes" --published-at "$published_at" \
            --assets artifacts --prefix dsh-desktop --output candidate.json
          node -e '
            const candidate = require("./candidate.json")
            for (const key of ["candidate_tag", "candidate_commit", "manifest_url", "manifest_sha256"])
              process.stdout.write(`${key}=${candidate[key]}\n`)
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-recovery-candidate-${{ github.run_id }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 90

  recovery-native-smoke:
    name: Collect four-target recovery fresh-install evidence
    needs: prepare-recovery
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/bootstrap-update-smoke.yml
    secrets: inherit
    with:
      candidate_tag: ${{ needs.prepare-recovery.outputs.candidate_tag }}
      candidate_commit: ${{ needs.prepare-recovery.outputs.candidate_commit }}
      manifest_url: ${{ needs.prepare-recovery.outputs.manifest_url }}
      manifest_sha256: ${{ needs.prepare-recovery.outputs.manifest_sha256 }}
      artifact_name_prefix: dsh-desktop
      approval_kind: broken-updater-recovery

  admit-recovery-evidence:
    name: Admit exact recovery evidence
    needs: [prepare-recovery, recovery-native-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.recovery-native-smoke.outputs.evidence_artifact_name }}
          path: evidence
      - name: Verify evidence attestations and exact recovery identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(evidence/*)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/bootstrap-update-smoke.yml" \
              --signer-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
          node scripts/verify-bootstrap-update-evidence.mjs --evidence evidence \
            --candidate-tag "${{ github.event.inputs.approved_tag }}" \
            --candidate-commit "${{ github.event.inputs.approved_commit }}" \
            --manifest-sha256 "${{ needs.prepare-recovery.outputs.manifest_sha256 }}" \
            --max-age-hours 24 --require-real-bootstrap --require-macos-signing

  finalize-recovery:
    name: Record recovery receipt and write Stable last
    needs: [prepare-recovery, recovery-native-smoke, admit-recovery-evidence]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updater-recovery-candidate-${{ github.run_id }}
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.recovery-native-smoke.outputs.evidence_artifact_name }}
          path: evidence
      - name: Reverify evidence attestations before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(evidence/*)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/bootstrap-update-smoke.yml" \
              --signer-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
          node scripts/verify-bootstrap-update-evidence.mjs --evidence evidence \
            --candidate-tag "${{ github.event.inputs.approved_tag }}" \
            --candidate-commit "${{ github.event.inputs.approved_commit }}" \
            --manifest-sha256 "${{ needs.prepare-recovery.outputs.manifest_sha256 }}" \
            --max-age-hours 24 --require-real-bootstrap --require-macos-signing
      - name: Rebind candidate artifact to protected recovery identity before credentials
        shell: bash
        env:
          APPROVED_TAG: ${{ vars.UPDATER_RECOVERY_TAG }}
          APPROVED_VERSION: ${{ vars.UPDATER_RECOVERY_VERSION }}
          APPROVED_COMMIT: ${{ vars.UPDATER_RECOVERY_COMMIT }}
          CANDIDATE_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_MANIFEST_SHA256 }}
          BROKEN_VERSION: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_VERSION }}
          BROKEN_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_MANIFEST_SHA256 }}
          PRIOR_RECEIPT_KEY: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_KEY }}
          PRIOR_RECEIPT_SHA256: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_SHA256 }}
          FAILED_PROMOTION_RUN_ID: ${{ vars.UPDATER_RECOVERY_FAILED_PROMOTION_RUN_ID }}
        run: |
          set -euo pipefail
          node -e '
            const candidate = require("./candidate/candidate.json")
            const expected = {
              candidate_tag: process.env.APPROVED_TAG,
              candidate_version: process.env.APPROVED_VERSION,
              candidate_commit: process.env.APPROVED_COMMIT,
              manifest_sha256: process.env.CANDIDATE_MANIFEST_SHA256,
              broken_stable_version: process.env.BROKEN_VERSION,
              broken_stable_manifest_sha256: process.env.BROKEN_MANIFEST_SHA256,
              prior_bootstrap_receipt_key: process.env.PRIOR_RECEIPT_KEY,
              prior_bootstrap_receipt_sha256: process.env.PRIOR_RECEIPT_SHA256,
              failed_promotion_run_id: process.env.FAILED_PROMOTION_RUN_ID,
            }
            for (const [key, value] of Object.entries(expected)) {
              if (!value || candidate[key] !== value) throw new Error(`recovery candidate mismatch for ${key}`)
            }
          '
      - name: Install checksum-verified ossutil
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          printf '%s  %s\n' dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343 "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/ossutil"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/ossutil/ossutil-v1.7.19-linux-amd64/ossutil" "$RUNNER_TEMP/bin/ossutil"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Exchange final recovery OIDC identity
        id: credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: dsh-recovery-finalize-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Write immutable recovery receipt, verify it, then write Stable last
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.credentials.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          APPROVED_TAG: ${{ vars.UPDATER_RECOVERY_TAG }}
          APPROVED_VERSION: ${{ vars.UPDATER_RECOVERY_VERSION }}
          APPROVED_COMMIT: ${{ vars.UPDATER_RECOVERY_COMMIT }}
          CANDIDATE_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_MANIFEST_SHA256 }}
          BROKEN_VERSION: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_VERSION }}
          BROKEN_MANIFEST_SHA256: ${{ vars.UPDATER_RECOVERY_BROKEN_STABLE_MANIFEST_SHA256 }}
          PRIOR_RECEIPT_KEY: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_KEY }}
          PRIOR_RECEIPT_SHA256: ${{ vars.UPDATER_RECOVERY_PRIOR_RECEIPT_SHA256 }}
          FAILED_PROMOTION_RUN_ID: ${{ vars.UPDATER_RECOVERY_FAILED_PROMOTION_RUN_ID }}
        run: >-
          node scripts/promote-stable-release.mjs --finalize-updater-recovery
          --candidate candidate/candidate.json --evidence evidence
          --max-age-hours 24 --prefix dsh-desktop
          --approved-tag "$APPROVED_TAG" --approved-version "$APPROVED_VERSION"
          --approved-commit "$APPROVED_COMMIT"
          --approved-candidate-manifest-sha256 "$CANDIDATE_MANIFEST_SHA256"
          --approved-broken-stable-version "$BROKEN_VERSION"
          --approved-broken-stable-manifest-sha256 "$BROKEN_MANIFEST_SHA256"
          --approved-prior-receipt-key "$PRIOR_RECEIPT_KEY"
          --approved-prior-receipt-sha256 "$PRIOR_RECEIPT_SHA256"
          --approved-failed-promotion-run-id "$FAILED_PROMOTION_RUN_ID"
