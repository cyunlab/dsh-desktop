name: Temporary production OIDC diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-oidc:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify exact GitHub OIDC claims
        shell: bash
        env:
          EXPECTED_SUBJECT: repo:cyunlab@318327647/dsh-desktop@1335996339:environment:production
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.aliyuncs.com")"
          RESPONSE="$response" node - <<'NODE'
          const token = JSON.parse(process.env.RESPONSE).value
          const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
          const expected = {
            iss: 'https://token.actions.githubusercontent.com',
            aud: 'sts.aliyuncs.com',
            sub: process.env.EXPECTED_SUBJECT
          }
          for (const [key, value] of Object.entries(expected)) {
            if (payload[key] !== value) throw new Error(`${key} claim mismatch: ${payload[key]}`)
          }
          console.log(JSON.stringify({ iss: payload.iss, aud: payload.aud, sub: payload.sub }))
          NODE
      - name: Exchange OIDC identity for temporary Alibaba Cloud credentials
        id: credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_ROLE_ARN }}
          role-session-name: dsh-oidc-diagnostic-${{ github.run_id }}
          role-session-expiration: 900
          audience: sts.aliyuncs.com
      - name: Verify prefix-scoped OSS permissions
        shell: bash
        env:
          ACCESS_KEY_ID: ${{ steps.credentials.outputs.aliyun-access-key-id }}
          ACCESS_KEY_SECRET: ${{ steps.credentials.outputs.aliyun-access-key-secret }}
          SECURITY_TOKEN: ${{ steps.credentials.outputs.aliyun-security-token }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          printf '%s  %s\n' dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343 "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/ossutil"
          ossutil="$RUNNER_TEMP/ossutil/ossutil-v1.7.19-linux-amd64/ossutil"
          endpoint="oss-${OSS_REGION}.aliyuncs.com"
          credentials=(-i "$ACCESS_KEY_ID" -k "$ACCESS_KEY_SECRET" -t "$SECURITY_TOKEN" -e "$endpoint")
          "$ossutil" cat "oss://${OSS_BUCKET}/dsh-desktop/channels/stable/latest.json" "${credentials[@]}" \
            | head -c 36 \
            | sha256sum \
            | grep -F '90e59093c7c43001e49280468b4377020e1d7dd752752aebe3b0ecdf5f8bede5'
          "$ossutil" ls "oss://${OSS_BUCKET}/dsh-desktop/" "${credentials[@]}" --max-keys 10
          if "$ossutil" ls "oss://${OSS_BUCKET}/" "${credentials[@]}" --max-keys 1; then
            echo 'Publishing role unexpectedly listed the bucket root.' >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            "${UPDATE_BASE_URL}/dsh-desktop/channels/stable/latest.json" \
            | sha256sum \
            | grep -F '90e59093c7c43001e49280468b4377020e1d7dd752752aebe3b0ecdf5f8bede5'
