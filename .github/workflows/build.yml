name: Build unsigned development artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CI: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the tag to exactly match package.json
        if: github.event_name == 'push'
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
            extension: exe
            artifact: dsh-desktop-windows-x64
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
            artifact: dsh-desktop-macos-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
            artifact: dsh-desktop-macos-x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            extension: AppImage
            artifact: dsh-desktop-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native package and probe packaged Host
        run: pnpm package --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dsh-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Write unsigned installation warnings
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Unsigned development build

          These artifacts are for development testing. They are not signed, notarized, or suitable for a public production release.

          - **Windows (x64, NSIS):** Microsoft Defender SmartScreen may warn that the publisher is unknown. Choose **More info**, verify the downloaded filename, then choose **Run anyway** only if you trust this repository and build.
          - **macOS (Apple silicon arm64 or Intel x64, DMG):** Gatekeeper will block an unnotarized app. After verifying the downloaded filename, control-click the app in Finder, choose **Open**, then confirm **Open** only if you trust this repository and build.
          - **Linux (x64, AppImage):** make the file executable with `chmod +x <filename>.AppImage`, then launch it directly.

          Publishing this draft is an explicit maintainer action. This workflow never publishes a release automatically.
          EOF
      - name: Create or update unpublished draft with native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-draft-release.mjs "${GITHUB_REF_NAME}" release-notes.md artifacts/*
