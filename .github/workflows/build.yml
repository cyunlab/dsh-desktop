name: Build desktop artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

env:
  CI: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  validate-release-version:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}
      - name: Require the tag commit to belong to main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{}" refs/remotes/origin/main
      - name: Require every application manifest to match the tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-version.mjs "${RELEASE_TAG}"

  behavior-tests:
    name: Run release test gate
    needs: validate-release-version
    uses: ./.github/workflows/test.yml
    with:
      release_ref: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.artifact }}
    needs: behavior-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
            artifact: dsh-desktop-windows-x64
          - runner: macos-15
            platform: mac
            arch: arm64
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
            artifact: dsh-desktop-macos-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
            artifact: dsh-desktop-macos-x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            artifact_path: src-tauri/target/release/bundle/deb/*.deb
            artifact: dsh-desktop-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - name: Install stable Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build native Tauri package with official Node and published CLI
        if: ${{ !(matrix.platform == 'mac' && matrix.arch == 'x64') }}
        run: pnpm package -- --verbose
      - name: Build Intel macOS package with one bounded DMG retry
        if: ${{ matrix.platform == 'mac' && matrix.arch == 'x64' }}
        shell: bash
        run: pnpm package -- --verbose || pnpm package -- --verbose
      - name: Smoke test official Node plus published dsh web
        run: pnpm smoke:dsh-cli
        env:
          # PowerShell startup is occasionally slower on hosted Windows runners.
          DSH_WINDOWS_CONTROLLER_START_TIMEOUT_MS: ${{ runner.os == 'Windows' && '60000' || '' }}
      - name: Verify the exact native Tauri artifact
        run: node scripts/verify-tauri-artifact.mjs "${{ matrix.platform }}"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dsh-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Generate changes from the previous reachable release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/generate-release-notes.mjs "${RELEASE_TAG}" release-notes.md
      - name: Create or update unpublished draft with native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/reconcile-draft-release.mjs "${RELEASE_TAG}" release-notes.md artifacts/*
