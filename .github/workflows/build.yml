name: Build desktop artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

env:
  CI: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  validate-release-version:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}
      - name: Require the tag commit to belong to main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{}" refs/remotes/origin/main
      - name: Require every application manifest to match the tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-version.mjs "${RELEASE_TAG}"

  behavior-tests:
    name: Run release test gate
    needs: validate-release-version
    uses: ./.github/workflows/test.yml
    with:
      release_ref: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.artifact }}
    needs: behavior-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
            updater_target: windows-x86_64
            artifact: dsh-desktop-windows-x64
          - runner: macos-15
            platform: mac
            arch: arm64
            updater_target: darwin-aarch64
            artifact: dsh-desktop-macos-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            updater_target: darwin-x86_64
            artifact: dsh-desktop-macos-x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            updater_target: linux-x86_64
            artifact: dsh-desktop-linux-x64
    runs-on: ${{ matrix.runner }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - name: Install stable Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Import Developer ID certificate and notarization key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/dsh-desktop-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | openssl base64 -d -A -out "$api_key"
          chmod 600 "$certificate" "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
      - name: Build native Tauri package with official Node and published CLI
        if: matrix.platform != 'mac'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DSH_UPDATER_ENDPOINT: https://updates.cyunlab.com/dsh-desktop/channels/stable/latest.json
          DSH_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: ${{ matrix.platform == 'linux' && '1' || '' }}
        run: pnpm package -- --verbose
      - name: Build and recursively sign macOS application
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DSH_UPDATER_ENDPOINT: https://updates.cyunlab.com/dsh-desktop/channels/stable/latest.json
          DSH_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # 先只生成 .app；完整 Runtime closure 会在下面递归签名后再统一提交公证。
          env -u APPLE_API_ISSUER -u APPLE_API_KEY -u APPLE_API_KEY_PATH \
            pnpm tauri:build --bundles app --verbose
          version="$(node -p "require('./package.json').version")"
          app_path="src-tauri/target/release/bundle/macos/DeepSeek Harness Desktop.app"
          app_directory="$(dirname "$app_path")"
          dmg_directory="src-tauri/target/release/bundle/dmg"
          dmg_path="${dmg_directory}/DeepSeek Harness Desktop_${version}_${{ matrix.arch }}.dmg"
          app_notary_zip="$RUNNER_TEMP/dsh-desktop-${{ matrix.arch }}-notary.zip"
          test -d "$app_path"

          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q 'Mach-O'; then
              codesign --force \
                --sign "$APPLE_SIGNING_IDENTITY" \
                --options runtime \
                --timestamp \
                "$candidate"
            fi
          done < <(find "$app_path/Contents" -type f -print0)
          codesign --force \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --timestamp \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          # Tauri creates the updater archive before the recursive signing above.
          # Notarize and staple the final app, then replace and re-sign that archive.
          ditto -c -k --keepParent "$app_path" "$app_notary_zip"
          xcrun notarytool submit "$app_notary_zip" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --key "$APPLE_API_KEY_PATH" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          shopt -s nullglob
          updater_archives=("$app_directory"/*.app.tar.gz)
          [[ ${#updater_archives[@]} -eq 1 ]] || { echo "Expected exactly one macOS updater archive." >&2; exit 1; }
          updater_archive="${updater_archives[0]}"
          rm -f "$updater_archive" "$updater_archive.sig"
          tar -czf "$updater_archive" -C "$app_directory" "$(basename "$app_path")"
          pnpm tauri signer sign "$updater_archive"
          test -s "$updater_archive.sig"

          mkdir -p "$dmg_directory"
          hdiutil create -volname "DeepSeek Harness Desktop" \
            -srcfolder "$app_path" -ov -format UDZO "$dmg_path"
      - name: Sign, notarize, and staple macOS package
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "Expected exactly one macOS DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --key "$APPLE_API_KEY_PATH" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
      - name: Smoke test official Node plus published dsh web
        run: pnpm smoke:dsh-cli
        env:
          # PowerShell startup is occasionally slower on hosted Windows runners.
          DSH_WINDOWS_CONTROLLER_START_TIMEOUT_MS: ${{ runner.os == 'Windows' && '60000' || '' }}
      - name: Verify the exact native Tauri artifact
        run: node scripts/verify-tauri-artifact.mjs "${{ matrix.platform }}"
      - name: Stage uniquely named release and updater assets
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          UPDATER_TARGET: ${{ matrix.updater_target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          if [[ "$PLATFORM" == "win" ]]; then
            packages=(src-tauri/target/release/bundle/nsis/*.exe)
            signatures=(src-tauri/target/release/bundle/nsis/*.exe.sig)
            suffix=exe
          elif [[ "$PLATFORM" == "linux" ]]; then
            packages=(src-tauri/target/release/bundle/appimage/*.AppImage)
            signatures=(src-tauri/target/release/bundle/appimage/*.AppImage.sig)
            suffix=AppImage
          else
            packages=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
            signatures=(src-tauri/target/release/bundle/macos/*.app.tar.gz.sig)
            dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
            [[ ${#dmgs[@]} -eq 1 ]] || { echo "Expected exactly one macOS DMG." >&2; exit 1; }
            cp "${dmgs[0]}" "release-assets/dsh-desktop-${UPDATER_TARGET}-installer.dmg"
            suffix=app.tar.gz
          fi
          [[ ${#packages[@]} -eq 1 ]] || { echo "Expected exactly one updater package." >&2; exit 1; }
          [[ ${#signatures[@]} -eq 1 ]] || { echo "Expected exactly one updater signature." >&2; exit 1; }
          cp "${packages[0]}" "release-assets/dsh-desktop-${UPDATER_TARGET}-updater.${suffix}"
          cp "${signatures[0]}" "release-assets/dsh-desktop-${UPDATER_TARGET}-updater.${suffix}.sig"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dsh-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Generate changes from the previous reachable release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/generate-release-notes.mjs "${RELEASE_TAG}" release-notes.md
      - name: Create or update unpublished draft with native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/reconcile-draft-release.mjs "${RELEASE_TAG}" release-notes.md artifacts/*
