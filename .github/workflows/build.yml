name: Build unsigned development artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CI: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to exactly match package.json
        if: github.event_name == 'push'
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
            extension: exe
            artifact: unsigned-dev-windows-x64
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
            artifact: unsigned-dev-macos-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
            artifact: unsigned-dev-macos-x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            extension: AppImage
            artifact: unsigned-dev-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native package and probe packaged Host
        run: pnpm package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-dev-*
          path: artifacts
          merge-multiple: true
      - name: Write unsigned installation warnings
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Unsigned development build

          These artifacts are for development testing. They are not signed, notarized, or suitable for a public production release.

          - **Windows (x64, NSIS):** Microsoft Defender SmartScreen may warn that the publisher is unknown. Choose **More info**, verify the downloaded filename, then choose **Run anyway** only if you trust this repository and build.
          - **macOS (Apple silicon arm64 or Intel x64, DMG):** Gatekeeper will block an unnotarized app. After verifying the downloaded filename, control-click the app in Finder, choose **Open**, then confirm **Open** only if you trust this repository and build.
          - **Linux (x64, AppImage):** make the file executable with `chmod +x <filename>.AppImage`, then launch it directly.

          Publishing this draft is an explicit maintainer action. This workflow never publishes a release automatically.
          EOF
      - name: Create unpublished draft with native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --draft --verify-tag --title "DeepSeek Harness Desktop ${GITHUB_REF_NAME} (unsigned development build)" --notes-file release-notes.md
